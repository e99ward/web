<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoclave Water Level Visualization</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #f0f2f5;
        }
        .header {
            background-color: #47995a;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .panel {
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        #control-panel {
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
        }
        #visualization-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        #report-panel {
            width: 300px;
            background-color: #ffffff;
            border-left: 1px solid #ddd;
        }
        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="number"], input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .vessel-lid {
            width: 200px;
            height: 10px;
            position: relative;
            background-color: #8e8e8e;
            overflow: hidden;
        }
        .vessel-container {
            width: 150px;
            height: 400px;
            border: 4px solid #444;
            border-radius: 0px 0px 20px 20px;
            position: relative;
            background-color: #e9ecef;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(to right, #007bff, #0056b3);
            transition: height 0.1s ease-out;
        }
        .steam {
            position: absolute;
            top: 0;
            width: 100%;
            background: #ffb6c1b5;
            transition: height 0.1s ease-out;
        }
        .temp-slider-container {
            width: 80%;
            margin-top: 40px;
            text-align: center;
            position: relative;
        }
        .tick-labels {
            position: relative;
            width: 100%;
            height: 25px;
            margin-top: 5px;
        }
        .tick-labels span {
            position: absolute;
            top: -8px;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #666;
            white-space: nowrap;
        }
        /* .tick-labels span::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 50%;
            width: 1px;
            height: 6px;
            background-color: #ccc;
        } */
        #temp-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #d9534f;
            margin-bottom: 10px;
        }
        h3 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #333;
            padding-bottom: 5px;
        }
        .report-item {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .report-label {
            font-size: 0.8rem;
            color: #777;
            text-transform: uppercase;
        }
        .report-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
        }
        .unit {
            font-size: 0.8rem;
            color: #666;
            margin-left: 4px;
        }
        .event-msg {
            font-size: 0.9rem;
            color: #d9534f;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Autoclave Water Level Visualization</h1>
</div>

<div class="main-container">
    <div id="control-panel" class="panel">
        <h2>Control Parameters</h2>
        <div class="input-group">
            <label for="vessel-h">Vessel Height [cm]</label>
            <input type="number" id="vessel-h" value="173" step="1">
        </div>
        <div class="input-group">
            <label for="initial-h">Initial Water Level [cm]</label>
            <input type="number" id="initial-h" value="86" step="1">
        </div>
    </div>

    <div id="visualization-panel" class="panel">
        <div id="vessel-lid" class="vessel-lid">
        </div>
        <div id="vessel" class="vessel-container">
            <div id="steam-layer" class="steam"></div>
            <div id="water-layer" class="water"></div>
        </div>
        <div class="temp-slider-container">
            <div id="temp-display">20 °C</div>
            <input type="range" id="temp-slider" min="20" max="500" value="20" step="1" list="temp-markers">
            <datalist id="temp-markers">
                <option value="100"></option>
                <option value="200"></option>
                <option value="300"></option>
                <option value="400"></option>
                <option value="500"></option>
            </datalist>
            <div class="tick-labels">
                <span style="left: 0%">20</span>
                <span style="left: 16.67%">100</span>
                <span style="left: 37.5%">200</span>
                <span style="left: 58.33%">300</span>
                <span style="left: 79.17%">400</span>
                <span style="left: 100%">500</span>
            </div>
            <h3>System Temperature</h3>
        </div>
    </div>

    <div id="report-panel" class="panel">
        <h2>Report</h2>
        <div class="report-item">
            <div class="report-label">System Pressure</div>
            <div id="res-pressure" class="report-value">0.00</div>
            <span class="unit">atm</span>
        </div>
        <div class="report-item">
            <div class="report-label">Density of Water</div>
            <div id="res-rho-w" class="report-value">0.00</div>
            <span class="unit">kg/m³</span>
        </div>
        <div class="report-item">
            <div class="report-label">Density of Steam</div>
            <div id="res-rho-s" class="report-value">0.00</div>
            <span class="unit">kg/m³</span>
        </div>
        <div class="report-item">
            <div class="report-label">Water Height</div>
            <div id="res-h" class="report-value">0.00</div>
            <span class="unit">cm</span>
        </div>
        <div id="event-box" class="event-msg"></div>
    </div>
</div>

    const equiTable = equiTableRaw.trim().split('\n').map(line => {
        const parts = line.split(',').map(Number);
        return {T: parts[0], P: parts[1], rho_w: parts[2], rho_s: parts[3]};
    });

    // --- Core Physics Logic ---

    function getEquiData(T) {
        // Interpolate from equiTable
        if (T < equiTable[0].T) return equiTable[0];
        if (T > equiTable[equiTable.length - 1].T) return equiTable[equiTable.length - 1];
        
        for (let i = 0; i < equiTable.length - 1; i++) {
            if (T >= equiTable[i].T && T <= equiTable[i+1].T) {
                const t0 = equiTable[i].T;
                const t1 = equiTable[i+1].T;
                const ratio = (T - t0) / (t1 - t0);
                return {
                    P: equiTable[i].P + ratio * (equiTable[i+1].P - equiTable[i].P),
                    rho_w: equiTable[i].rho_w + ratio * (equiTable[i+1].rho_w - equiTable[i].rho_w),
                    rho_s: equiTable[i].rho_s + ratio * (equiTable[i+1].rho_s - equiTable[i].rho_s)
                };
            }
        }
    }

    function getPressurePa(rho, T_C) {
        const T_K = T_C + 273.15;
        const dt = rho / rho_c;
        const tt = T_c / T_K;
        let sum = 0.0;

        // Terms 1-7
        for (let i = 1; i <= 7; i++) {
            const A = hA[i];
            sum += A.n * A.d * Math.pow(dt, A.d - 1) * Math.pow(tt, A.t);
        }

        // Terms 8-51
        for (let i = 8; i <= 51; i++) {
            const A = hA[i];
            sum += A.n * Math.exp(-Math.pow(dt, A.c)) * Math.pow(dt, A.d - 1) * Math.pow(tt, A.t) * (A.d - A.c * Math.pow(dt, A.c));
        }

        // Terms 52-54
        for (let i = 52; i <= 54; i++) {
            const A = hA[i];
            sum += A.n * Math.pow(dt, A.d) * Math.pow(tt, A.t) * Math.exp(-A.a * (dt - A.e) * (dt - A.e) - A.b * (tt - A.g) * (tt - A.g)) * (A.d / dt - 2.0 * A.a * (dt - A.e));
        }

        // Terms 55-56
        for (let i = 55; i <= 56; i++) {
            const A = hA[i];
            const ddt = (dt - 1.0) * (dt - 1.0);
            const Theta = (1.0 - tt) + A.g * Math.pow(ddt, 0.5 / A.e);
            const Delta = Theta * Theta + A.t * Math.pow(ddt, A.c);
            const Phi = Math.exp(-A.a * (dt - 1.0) * (dt - 1.0) - A.b * (tt - 1.0) * (tt - 1.0));
            const dPhi = -2.0 * A.a * (dt - 1.0) * Phi;
            const dDelta = A.d * Math.pow(Delta, A.d - 1) * (dt - 1.0) * 2.0 * (A.g * Theta / A.e * Math.pow(ddt, 0.5 / A.e - 1) + A.t * A.c * Math.pow(ddt, A.c - 1));
            sum += A.n * (Math.pow(Delta, A.d) * (Phi + dt * dPhi) + dDelta * dt * Phi);
        }

        const pressure = rho * R_water * T_K * (1.0 + dt * sum);
        return pressure;
    }

    // --- UI Update logic ---

    const vHInput = document.getElementById('vessel-h');
    const h0Input = document.getElementById('initial-h');
    const tempSlider = document.getElementById('temp-slider');
    const tempDisplay = document.getElementById('temp-display');
    const waterLayer = document.getElementById('water-layer');
    const steamLayer = document.getElementById('steam-layer');
    const eventBox = document.getElementById('event-box');

    const resPressure = document.getElementById('res-pressure');
    const resRhoW = document.getElementById('res-rho-w');
    const resRhoS = document.getElementById('res-rho-s');
    const resH = document.getElementById('res-h');

    function update() {
        const H = parseFloat(vHInput.value);
        const h0 = parseFloat(h0Input.value);
        const T = parseFloat(tempSlider.value);

        tempDisplay.innerText = `${T} °C`;

        const totalMass = rho0 * h0; // g/cm^2 (normalized by area)
        const rho_f = totalMass / H; // g/cm^3

        let pressure, rhoW_kg, rhoS_kg, height;
        let event = "";

        if (T < 374) {
            const equi = getEquiData(T);
            rhoW_kg = equi.rho_w * 1000;
            rhoS_kg = equi.rho_s * 1000;
            
            // h = (rho0*h0 - rho_s*H) / (rho_w - rho_s)
            height = (rho0 * h0 - equi.rho_s * H) / (equi.rho_w - equi.rho_s);

            if (height >= H) {
                event = "Event: Full Water";
                height = H;
                rhoW_kg = rho_f * 1000;
                rhoS_kg = rho_f * 1000;
                pressure = getPressurePa(rhoW_kg, T) / 101325;
            } else if (height <= 0) {
                event = "Event: Full Steam";
                height = 0;
                rhoW_kg = NaN;
                rhoS_kg = rho_f * 1000;
                pressure = getPressurePa(rhoS_kg, T) / 101325;
            } else {
                pressure = equi.P;
            }
        } else {
            // Supercritical / Gas phase
            event = "Event: Supercritical / Gas Phase";
            height = 0;
            rhoW_kg = NaN;
            rhoS_kg = rho_f * 1000;
            pressure = getPressurePa(rhoS_kg, T) / 101325;
        }

        // Update UI
        const waterHeightPercent = (height / H) * 100;
        waterLayer.style.height = `${waterHeightPercent}%`;
        steamLayer.style.height = `${100 - waterHeightPercent}%`;

        resPressure.innerText = pressure.toFixed(2);
        resRhoW.innerText = isNaN(rhoW_kg) ? "N/A" : rhoW_kg.toFixed(2);
        resRhoS.innerText = rhoS_kg.toFixed(2);
        resH.innerText = height.toFixed(2);
        eventBox.innerText = event;
    }

    [vHInput, h0Input, tempSlider].forEach(el => {
        el.addEventListener('input', update);
    });

    // Initial update
    update();
