<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Girl Group Matrix</title>
    <link rel="stylesheet" href="matrix.css?v=20261029-1">
    <script src="matrix.js?v=20261029-1" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Girl Group Matrix</h1>
        <a href="gg-chrono.html">Group timeline</a>
    </header>
    <main>
        <nav class="matrix-controls" aria-label="그룹 정렬 및 필터">
            <fieldset>
                <legend>정렬</legend>
                <div class="control-options">
                    <button type="button" data-sort="name" aria-pressed="true" onclick="sortName()">그룹명</button>
                    <button type="button" data-sort="date" aria-pressed="false" onclick="sortDate()">데뷔일자 ↑</button>
                    <button type="button" data-sort="actv" aria-pressed="false" onclick="sortActv()">데뷔일자 ↓</button>
                    <button type="button" data-sort="nums" aria-pressed="false" onclick="sortNums()">멤버수</button>
                </div>
            </fieldset>
            <fieldset>
                <legend>필터</legend>
                <div class="control-options">
                    <label class="filter-option"><input type="checkbox" id="active"> 활동중인 그룹</label>
                    <label class="filter-option"><input type="checkbox" id="members"> 멤버 정보</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>세대</legend>
                <div class="control-options">
                    <label class="filter-option"><input type="checkbox" id="gen1" checked> 1세대</label>
                    <label class="filter-option"><input type="checkbox" id="gen2" checked> 2세대</label>
                    <label class="filter-option"><input type="checkbox" id="gen3" checked> 3세대</label>
                    <label class="filter-option"><input type="checkbox" id="gen4" checked> 4세대</label>
                    <label class="filter-option"><input type="checkbox" id="gen5" checked> 5세대</label>
                </div>
            </fieldset>
        </nav>
        <p id="matrix-status" role="status">그룹 정보를 불러오는 중…</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="걸그룹 목록">
            <table class="matrix" id="matrixcontext" aria-label="걸그룹 정보"></table>
        </div>
    </main>
</body>
</html>
